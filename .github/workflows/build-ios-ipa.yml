name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      APP_ENV: production
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://multica.guangzu.online:8443
      EXPO_BUNDLE_IDENTIFIER_PROD: com.personal.multica

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile

      - name: Generate iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild -p ios --no-install

      - name: Install iOS pods
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Build Release for iPhone (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find apps/mobile/ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            -parallelizeTargets NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/build/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/$(basename "$app")"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Multica.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Multica-IPA
          path: Multica.ipa
          if-no-files-found: error
          retention-days: 7
